name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Build frio do container (sem cache) passa de 10 min (apt+xmlsec, npm,
          # chromium do playwright, export de layers) e estourava o default. 30m cobre.
          command_timeout: 30m
          script: |
            sudo chown -R $USER:$USER ${{ secrets.VM_PROJECT_PATH }} || true
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull origin main
            bash scripts/deploy.sh
